services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openimport
      POSTGRES_PASSWORD: openimport
      POSTGRES_DB: openimport
    ports:
      - "5434:5432"
    volumes:
      - openimport_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openimport -d openimport"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openimport_postgres:
